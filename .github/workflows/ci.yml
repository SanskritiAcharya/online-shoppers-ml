name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The saved model, the data and the result tables are committed, so the tests run without retraining.
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t online-shoppers-ml .
      - name: Check the API starts and answers /health
        run: |
          docker run -d -p 8000:8000 --name api online-shoppers-ml
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
